apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentication-prod-ingress
  namespace: production
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: grpc-web@kubernetescrd
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grpc.wookiesrpeople2.dev
      secretName: cloudflare-api-token
  rules:
    - host: grpc.wookiesrpeople2.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentication
                port:
                  name: grpc
